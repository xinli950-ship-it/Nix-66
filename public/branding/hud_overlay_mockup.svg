<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Top HUD: Health Bars -->
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left Fighter Health -->
  <rect x="100" y="50" width="600" height="40" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="2" />
  <rect x="100" y="50" width="550" height="40" fill="url(#healthGrad)" />
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">GOKU</text>
  
  <!-- Right Fighter Health -->
  <rect x="1220" y="50" width="600" height="40" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="2" />
  <rect x="1270" y="50" width="550" height="40" fill="url(#healthGrad)" />
  <text x="1820" y="40" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold" text-anchor="end">ROMAN REIGNS</text>

  <!-- Center Timer/VS -->
  <circle cx="960" cy="70" r="50" fill="#d32f2f" stroke="white" stroke-width="3" />
  <text x="960" y="82" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">VS</text>

  <!-- Bottom HUD: Momentum Meter -->
  <rect x="710" y="980" width="500" height="30" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="2" />
  <rect x="960" y="980" width="150" height="30" fill="#2196f3" /> <!-- Blue side for P1 -->
  <rect x="810" y="980" width="150" height="30" fill="#ff9800" /> <!-- Orange side for P2 -->
  <text x="960" y="970" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">MOMENTUM</text>
  
  <!-- "LIVE" Indicator -->
  <circle cx="150" cy="1000" r="10" fill="#f44336" />
  <text x="170" y="1007" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">DREAM MATCH SIMULATION</text>
</svg>
