<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a1a" />
  
  <!-- Header -->
  <rect width="800" height="60" fill="#d32f2f" />
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="30" fill="white" text-anchor="middle" font-weight="bold">TALE OF THE TAPE</text>
  
  <!-- Left Character -->
  <text x="150" y="100" font-family="Arial, sans-serif" font-size="24" fill="#ffeb3b" text-anchor="middle" font-weight="bold">GOKU</text>
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Dragon Ball</text>
  
  <!-- Center Divider -->
  <line x1="400" y1="80" x2="400" y2="350" stroke="white" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Right Character -->
  <text x="650" y="100" font-family="Arial, sans-serif" font-size="24" fill="#ffeb3b" text-anchor="middle" font-weight="bold">ROMAN REIGNS</text>
  <text x="650" y="130" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">The Bloodline (WWE)</text>
  
  <!-- Stats Rows -->
  <g font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">
    <!-- Row 1: Strength -->
    <text x="150" y="180">OVER 9000</text>
    <text x="400" y="180" fill="#ffeb3b">STRENGTH</text>
    <text x="650" y="180">GOD-TIER</text>
    
    <!-- Row 2: Speed -->
    <text x="150" y="230">LIGHT SPEED</text>
    <text x="400" y="230" fill="#ffeb3b">SPEED</text>
    <text x="650" y="230">POWERHOUSE</text>
    
    <!-- Row 3: Special Move -->
    <text x="150" y="280">KAMEHAMEHA</text>
    <text x="400" y="280" fill="#ffeb3b">FINISHER</text>
    <text x="650" y="280">SPEAR</text>
    
    <!-- Row 4: Category -->
    <text x="150" y="330">ANIME</text>
    <text x="400" y="330" fill="#ffeb3b">CLASS</text>
    <text x="650" y="330">WWE</text>
  </g>
</svg>
