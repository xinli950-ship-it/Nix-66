<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
.video-container { position: relative; width: 800px; height: 450px; overflow: hidden; }
.frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: fadeCycle 5s infinite; }
.frame:nth-child(1) { animation-delay: 0s; }
.frame:nth-child(2) { animation-delay: 1.67s; }
.frame:nth-child(3) { animation-delay: 3.33s; }
@keyframes fadeCycle {
  0% { opacity: 0; }
  8% { opacity: 1; }
  33% { opacity: 1; }
  41% { opacity: 0; }
  100% { opacity: 0; }
}
</style></head><body>
<div class="video-container">
  <img class="frame" src="demo-fight-keyframe.png">
  <img class="frame" src="frame2-midclash.png">
  <img class="frame" src="frame3-impact.png">
</div>
</body></html>
